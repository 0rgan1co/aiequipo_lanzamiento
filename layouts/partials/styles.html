<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   DESIGN TOKENS — AI+Equipo Brand (Light Mode)
   ============================================================ */
:root {
  --cyan:         #00AEFE;
  --cyan-deep:    #0076B8;
  --cyan-light:   #D4F8FE;
  --cyan-bg:      #EBF7FF;
  --cyan-border:  #B3DEFF;
  --lavender:     #CABDEC;
  --lav-bg:       #F3F0FB;
  --lav-border:   #D9D0F5;
  --yellow:       #CABDEC;
  --yellow-bg:    #F3F0FB;
  --yellow-border:#D9D0F5;
  --yellow-text:  #6B5FA8;
  --green:        #1B6E3A;
  --green-bg:     #EDFBF3;
  --green-border: #A8DFBF;
  --red-bg:       #FFF0F0;
  --red-border:   #FFBBBB;
  --red-text:     #8B1A1A;

  /* Neutrals */
  --ink-900: #111318;
  --ink-700: #2C3038;
  --ink-500: #565C68;
  --ink-300: #9EA5B0;
  --ink-100: #E4E7EC;
  --ink-50:  #F7F8FA;
  --white:   #FFFFFF;

  /* Semantic */
  --text:      var(--ink-700);
  --text-sub:  var(--ink-500);
  --muted:     var(--ink-300);
  --bg:        #F0F2F5;
  --bg-card:   var(--white);
  --border:    var(--ink-100);

  /* Shape */
  --radius-sm:  6px;
  --radius:     12px;
  --radius-lg:  18px;
  --radius-xl:  24px;
  --radius-pill:9999px;

  /* Shadows */
  --shadow-xs: 0 1px 2px rgba(0,0,0,.05);
  --shadow-sm: 0 1px 4px rgba(0,0,0,.06), 0 2px 8px rgba(0,0,0,.04);
  --shadow-md: 0 4px 16px rgba(0,0,0,.08), 0 1px 4px rgba(0,0,0,.04);
  --shadow-lg: 0 8px 32px rgba(0,0,0,.1),  0 2px 8px rgba(0,0,0,.05);
}

/* ============================================================
   RESET & BASE
   ============================================================ */
*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
html { scroll-behavior:smooth; }
body {
  font-family:'DM Sans',sans-serif;
  background:var(--bg);
  color:var(--text);
  line-height:1.65;
  font-size:15px;
  -webkit-font-smoothing:antialiased;
}
a { color:var(--cyan-deep); text-decoration:none; }
a:hover { text-decoration:underline; }
strong { font-weight:600; }
img { max-width:100%; }

/* ============================================================
   HEADER — light, sticky, clean
   ============================================================ */
.hdr {
  background:var(--white);
  position:sticky; top:0; z-index:100;
  border-bottom:1px solid var(--border);
  box-shadow:var(--shadow-xs);
}
.hdr-in {
  max-width:1140px; margin:0 auto;
  padding:.75rem 2rem;
  display:flex; align-items:center; justify-content:space-between;
}
.logo { display:flex; align-items:center; gap:.875rem; }
.logo-img { height:28px; width:auto; display:block; }
.logo-sub-wrap { border-left:1px solid var(--border); padding-left:.875rem; }
.logo-sub { color:var(--muted); font-size:.62rem; font-family:'Inter',sans-serif; }
.nav { display:flex; gap:.125rem; }
.nav a {
  color:var(--text-sub);
  font-family:'Inter',sans-serif;
  font-size:.67rem; font-weight:500;
  padding:.3rem .65rem;
  border-radius:var(--radius-pill);
  transition:all .15s;
  text-transform:uppercase; letter-spacing:.5px;
}
.nav a:hover { background:var(--cyan-bg); color:var(--cyan-deep); text-decoration:none; }

/* ============================================================
   HERO — dark brand (mejor contraste)
   ============================================================ */
.hero {
  background:linear-gradient(135deg, #070708 0%, #0A1628 55%, #0B1A2E 100%);
  border-bottom:1px solid rgba(0,174,254,.12);
  padding:4.5rem 2rem 4rem;
  position:relative; overflow:hidden;
}
.hero::before {
  content:'';
  position:absolute; top:-120px; right:-80px;
  width:520px; height:520px;
  background:radial-gradient(circle, rgba(0,174,254,.12) 0%, transparent 65%);
  pointer-events:none;
}
.hero::after {
  content:'';
  position:absolute; bottom:-100px; left:-60px;
  width:380px; height:380px;
  background:radial-gradient(circle, rgba(202,189,236,.08) 0%, transparent 65%);
  pointer-events:none;
}
.hero-in {
  max-width:1140px; margin:0 auto;
  display:grid; grid-template-columns:1fr 260px;
  gap:4rem; align-items:start;
  position:relative; z-index:1;
}
.hero-left { display:flex; flex-direction:column; gap:1.5rem; }
.hero-right { display:flex; align-items:flex-start; justify-content:center; }

.hero-eyebrow {
  font-family:'Inter',sans-serif;
  font-size:.62rem; font-weight:700;
  color:var(--cyan);
  letter-spacing:2.5px; text-transform:uppercase;
}
.hero h1 {
  font-size:2.8rem; font-weight:700;
  line-height:1.08; letter-spacing:-1.5px;
  color:#ffffff;
}
.hero h1 span { color:var(--cyan); }
.hero-desc {
  color:rgba(255,255,255,.6);
  font-size:.93rem; line-height:1.8; max-width:500px;
}
.hero-meta { display:flex; flex-wrap:wrap; gap:.375rem; }
.pill {
  display:inline-flex; align-items:center;
  padding:.22rem .7rem;
  border-radius:var(--radius-pill);
  font-size:.67rem; font-weight:600;
  font-family:'Inter',sans-serif;
  border:1px solid; letter-spacing:.2px;
}
.pill-c { background:rgba(0,174,254,.15); color:var(--cyan); border-color:rgba(0,174,254,.3); }
.pill-y { background:rgba(202,189,236,.15); color:#6B5FA8; border-color:rgba(202,189,236,.4); }
.pill-w { background:rgba(255,255,255,.07); color:rgba(255,255,255,.7); border-color:rgba(255,255,255,.13); }

/* Stat cards — dark context */
.stat-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:.625rem; }
.stat-card {
  background:rgba(255,255,255,.05);
  border:1px solid rgba(255,255,255,.09);
  border-radius:var(--radius);
  padding:.875rem 1rem; text-align:center;
  backdrop-filter:blur(4px);
}
.stat-card:hover { border-color:rgba(0,174,254,.3); }
.stat-n {
  font-size:1.85rem; font-weight:700;
  color:var(--cyan); line-height:1;
  margin-bottom:.2rem; letter-spacing:-1px;
}
.stat-l {
  font-size:.67rem; color:rgba(255,255,255,.45);
  font-family:'Inter',sans-serif; line-height:1.4;
}

/* Video */
.hero-video-wrap {
  width:100%; aspect-ratio:9/16;
  border-radius:var(--radius-lg);
  overflow:hidden;
  box-shadow:var(--shadow-lg);
  background:#000; position:relative;
  border:1px solid var(--border);
}
.hero-video-wrap video { width:100%; height:100%; object-fit:cover; display:block; }
.unmute-btn {
  position:absolute; bottom:12px; right:12px;
  background:rgba(0,0,0,.5);
  border:none; border-radius:50%;
  width:34px; height:34px; font-size:.9rem;
  cursor:pointer;
  display:flex; align-items:center; justify-content:center;
  backdrop-filter:blur(6px);
  transition:.15s; color:white;
}
.unmute-btn:hover { background:rgba(0,118,184,.85); }

/* ============================================================
   MAIN LAYOUT
   ============================================================ */
.main { max-width:1140px; margin:0 auto; padding:3rem 2rem; }
.sec { margin-bottom:4rem; }
.sec-hdr {
  display:flex; align-items:baseline; gap:.875rem;
  margin-bottom:2rem; padding-bottom:.75rem;
  border-bottom:2px solid var(--border);
}
.sec-num {
  font-family:'Inter',sans-serif; font-size:.6rem;
  color:var(--cyan-deep); letter-spacing:2px;
  font-weight:700; text-transform:uppercase;
}
.sec-title { font-size:1.4rem; font-weight:700; letter-spacing:-.4px; color:var(--ink-900); }
.sep { border:none; border-top:1px solid var(--border); margin:3.5rem 0; }

/* ============================================================
   TLDR — light card with cyan accent
   ============================================================ */
.tldr-banner {
  background:var(--cyan-bg);
  border:1px solid var(--cyan-border);
  border-left:4px solid var(--cyan);
  border-radius:var(--radius-lg);
  padding:1.75rem 2rem;
  margin-bottom:3rem;
}
.tldr-tag {
  display:inline-flex; align-items:center;
  background:var(--cyan-deep); color:#fff;
  font-family:'Inter',sans-serif; font-weight:700;
  font-size:.6rem; padding:.2rem .6rem;
  border-radius:var(--radius-pill); letter-spacing:1px;
  text-transform:uppercase; margin-bottom:.875rem;
}
.tldr-title { font-weight:700; font-size:1rem; color:var(--ink-900); margin-bottom:1.125rem; }
.tldr-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:.875rem; }
.tldr-card {
  background:var(--white);
  border:1px solid var(--cyan-border);
  border-radius:var(--radius);
  padding:1rem 1.125rem;
  box-shadow:var(--shadow-xs);
}
.tldr-card-icon { font-size:1.25rem; margin-bottom:.375rem; }
.tldr-card-title { font-weight:700; font-size:.82rem; color:var(--ink-900); margin-bottom:.3rem; }
.tldr-card-desc { font-size:.76rem; color:var(--text-sub); line-height:1.65; }
.tldr-quote {
  margin-top:1rem; padding:.875rem 1.125rem;
  background:var(--white); border:1px solid var(--cyan-border);
  border-radius:var(--radius);
  font-size:.82rem; color:var(--text); line-height:1.65;
}
.tldr-quote strong { color:var(--cyan-deep); }

/* ============================================================
   RESUMEN
   ============================================================ */
.resumen-selfie {
  margin-bottom:1.75rem;
  border-radius:var(--radius-xl);
  overflow:hidden;
  position:relative;
  border:1px solid var(--border);
  box-shadow:var(--shadow-sm);
}
.selfie-img { width:100%; display:block; }
.selfie-caption {
  position:absolute; bottom:0; left:0; right:0;
  background:linear-gradient(to top, rgba(0,0,0,.6) 0%, transparent 100%);
  color:rgba(255,255,255,.85);
  font-size:.72rem; font-family:'Inter',sans-serif;
  padding:2rem 1.5rem .875rem; letter-spacing:.2px;
}
.resumen-grid { display:grid; grid-template-columns:1fr 1fr; gap:1rem; }
.res-card {
  background:var(--bg-card);
  border:1px solid var(--border);
  border-radius:var(--radius);
  padding:1.375rem;
  box-shadow:var(--shadow-xs);
  transition:all .2s;
}
.res-card:hover { box-shadow:var(--shadow-md); border-color:var(--cyan-border); transform:translateY(-1px); }
.res-card-icon { font-size:1.5rem; margin-bottom:.6rem; display:block; }
.res-card-title { font-weight:700; font-size:.9rem; margin-bottom:.375rem; color:var(--ink-900); }
.res-card-desc { font-size:.79rem; color:var(--text-sub); line-height:1.7; }

/* ============================================================
   DESAFIOS
   ============================================================ */
.desafios-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:1rem; }
.desafio-card {
  background:var(--bg-card);
  border:1px solid var(--border);
  border-radius:var(--radius);
  padding:1.25rem;
  box-shadow:var(--shadow-xs);
  transition:all .2s;
  position:relative;
}
.desafio-card:hover { box-shadow:var(--shadow-md); border-color:var(--cyan-border); transform:translateY(-2px); }
.desafio-id {
  display:inline-block; font-family:'Inter',sans-serif;
  font-size:.6rem; font-weight:700;
  color:var(--white); background:var(--cyan-deep);
  padding:.14rem .45rem; border-radius:var(--radius-sm);
  letter-spacing:.5px; margin-bottom:.5rem; text-transform:uppercase;
}
.desafio-title { font-weight:700; font-size:.88rem; line-height:1.4; margin-bottom:.5rem; color:var(--ink-900); }
.desafio-desc { font-size:.76rem; color:var(--text-sub); line-height:1.65; }
.desafio-card.top {
  border-top:3px solid var(--yellow);
  background:linear-gradient(135deg, #00ECFE 0%, #00AEFE 35%, #CABDEC 70%, #d4f8fe 100%);
  position:relative;
  overflow:hidden;
}
.desafio-card.top::before {
  content:'';
  position:absolute;
  top:-40px; left:-30px;
  width:180px; height:180px;
  background:radial-gradient(circle, rgba(255,255,255,.6) 0%, transparent 70%);
  pointer-events:none;
}
.desafio-card.top::after {
  content:'';
  position:absolute;
  bottom:-30px; right:-20px;
  width:140px; height:140px;
  background:radial-gradient(circle, rgba(0,174,254,.4) 0%, transparent 70%);
  pointer-events:none;
}
.desafio-card.top .desafio-id { background:rgba(0,0,0,.25); color:#fff; }
.desafio-card.top .desafio-title { color:#0A1628; }
.desafio-card.top .desafio-desc { color:rgba(10,22,40,.75); }
.desafio-card.top .top-badge {
  background:rgba(255,255,255,.35);
  color:#0A1628;
  border-color:rgba(255,255,255,.5);
}

.top-badge {
  display:inline-block;
  background:rgba(255,255,255,.35); color:#0A1628;
  border:1px solid rgba(255,255,255,.5);
  font-size:.58rem; font-weight:700;
  padding:.1rem .45rem; border-radius:var(--radius-pill);
  font-family:'Inter',sans-serif; text-transform:uppercase;
  letter-spacing:.5px; margin-bottom:.5rem;
}
.cosecha-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:1rem; }
.cosecha-card {
  background:var(--bg-card);
  border:1px solid var(--border);
  border-top:3px solid var(--cyan);
  border-radius:var(--radius);
  padding:1.25rem;
  box-shadow:var(--shadow-xs);
  display:flex; flex-direction:column; gap:.875rem;
  transition:all .2s;
}
.cosecha-card:hover { box-shadow:var(--shadow-md); border-color:var(--cyan-border); }
.cosecha-header { display:flex; align-items:flex-start; gap:.625rem; }
.cosecha-id {
  font-family:'Inter',sans-serif; font-size:.6rem; font-weight:700;
  color:var(--white); background:var(--cyan-deep);
  padding:.14rem .4rem; border-radius:var(--radius-sm);
  letter-spacing:.5px; text-transform:uppercase; flex-shrink:0; margin-top:2px;
}
.cosecha-title { font-weight:700; font-size:.88rem; color:var(--ink-900); line-height:1.35; }
.cosecha-ideas { display:flex; flex-direction:column; gap:.4rem; }
.idea {
  font-size:.77rem; color:var(--text-sub); line-height:1.6;
  padding:.45rem .7rem;
  background:var(--ink-50); border-radius:var(--radius-sm);
  border-left:2px solid var(--border);
}
.idea strong { color:var(--ink-700); font-weight:600; }
.cosecha-quote {
  font-size:.74rem; color:var(--cyan-deep); font-style:italic;
  border-left:2px solid var(--cyan);
  padding:.4rem .75rem; line-height:1.65;
  background:var(--cyan-bg);
  border-radius:0 var(--radius-sm) var(--radius-sm) 0;
}

/* ============================================================
   VOTACIONES
   ============================================================ */
.vot-grid { display:grid; grid-template-columns:1fr 1fr; gap:1.25rem; }
.vot-card {
  background:var(--bg-card); border:1px solid var(--border);
  border-radius:var(--radius); padding:1.375rem;
  box-shadow:var(--shadow-xs);
}
.vot-title {
  font-weight:700; font-size:.9rem; color:var(--ink-900);
  margin-bottom:1rem; padding-bottom:.625rem;
  border-bottom:2px solid var(--cyan-bg);
}
.vot-item { display:flex; align-items:center; gap:.75rem; margin-bottom:.625rem; }
.vot-rank { font-family:'Inter',sans-serif; font-size:.7rem; font-weight:700; color:var(--cyan-deep); width:22px; flex-shrink:0; }
.vot-label { font-size:.77rem; color:var(--text); flex:1; line-height:1.4; }
.vot-bar-w { width:64px; height:4px; background:var(--ink-100); border-radius:3px; overflow:hidden; flex-shrink:0; }
.vot-bar { height:100%; border-radius:3px; background:var(--cyan); }
.vot-bar.top { background:var(--yellow); }
.vot-result {
  display:flex; align-items:center; gap:.875rem;
  margin-bottom:.625rem; padding:.875rem 1rem;
  background:var(--ink-50); border:1px solid var(--border);
  border-radius:var(--radius-sm);
}
.vot-result.winner { background:var(--cyan-bg); border-color:var(--cyan-border); }
.vot-result-n {
  font-size:1.75rem; font-weight:700; color:var(--cyan-deep);
  flex-shrink:0; min-width:56px; letter-spacing:-1px; line-height:1;
}
.vot-result-label { font-size:.77rem; color:var(--text-sub); line-height:1.45; }
.vot-result-label strong { color:var(--text); font-weight:600; }

/* ============================================================
   RECURSOS
   ============================================================ */
.recursos-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:1rem; }
.rec-link {
  display:flex; align-items:center; gap:.875rem;
  background:var(--bg-card); border:1px solid var(--border);
  border-radius:var(--radius); padding:1.125rem;
  text-decoration:none; color:var(--text);
  box-shadow:var(--shadow-xs); transition:all .2s;
}
.rec-link:hover { border-color:var(--cyan-border); box-shadow:var(--shadow-md); transform:translateY(-2px); text-decoration:none; }
.rec-icon {
  width:40px; height:40px; border-radius:10px;
  background:var(--cyan-bg); border:1px solid var(--cyan-border);
  display:flex; align-items:center; justify-content:center;
  font-size:1.2rem; flex-shrink:0;
}
.rec-body { flex:1; min-width:0; }
.rec-title { font-weight:700; font-size:.84rem; color:var(--ink-900); margin-bottom:.15rem; }
.rec-desc { font-size:.71rem; color:var(--muted); overflow:hidden; text-overflow:ellipsis; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; line-height:1.4; }
.rec-link svg { margin-left:auto; flex-shrink:0; color:var(--muted); }

/* ============================================================
   FOOTER — dark strip at bottom (brand anchor)
   ============================================================ */
.footer {
  background:var(--ink-900);
  border-top:3px solid var(--cyan);
  padding:1.75rem 2rem; text-align:center;
  font-size:.71rem; color:rgba(255,255,255,.4);
  font-family:'Inter',sans-serif; margin-top:2rem;
  letter-spacing:.2px; line-height:1.7;
}
.footer strong { color:rgba(255,255,255,.7); }

/* ============================================================
   HALLAZGOS
   ============================================================ */
.hallazgos-grid { display:grid; grid-template-columns:1fr 1fr; gap:1rem; }
.hallazgo-card {
  background:var(--bg-card); border:1px solid var(--border);
  border-radius:var(--radius); padding:1.25rem;
  box-shadow:var(--shadow-xs); transition:all .2s;
}
.hallazgo-card:hover { box-shadow:var(--shadow-md); }
.hallazgo-hdr { display:flex; align-items:center; gap:.625rem; margin-bottom:.75rem; }
.hallazgo-id {
  font-family:'Inter',sans-serif; font-size:.6rem; font-weight:700;
  padding:.18rem .4rem; border-radius:var(--radius-sm); color:var(--white); flex-shrink:0;
}
.hallazgo-id.pos { background:var(--green); }
.hallazgo-id.neg { background:var(--red-text); }
.hallazgo-id.neu { background:var(--ink-500); }
.hallazgo-title { font-weight:700; font-size:.85rem; color:var(--ink-900); line-height:1.35; }
.hallazgo-desc { font-size:.75rem; color:var(--text-sub); line-height:1.65; margin-bottom:.625rem; }
.hallazgo-quote {
  font-size:.74rem; color:var(--cyan-deep); font-style:italic;
  border-left:2px solid var(--cyan); padding-left:.625rem; line-height:1.6;
  background:var(--cyan-bg); padding:.4rem .75rem;
  border-radius:0 var(--radius-sm) var(--radius-sm) 0;
}
.temp { display:inline-flex; align-items:center; gap:.25rem; font-size:.65rem; font-family:'Inter',sans-serif; font-weight:600; margin-left:auto; }
.temp.neg { color:var(--red-text); }
.temp.pos { color:var(--green); }

/* ============================================================
   CTA / PROXIMOS
   ============================================================ */
.cta-ideaton {
  background:linear-gradient(135deg, var(--cyan-bg), var(--lav-bg));
  border:1px solid var(--cyan-border);
  border-radius:var(--radius-xl);
  padding:2.5rem; text-align:center;
}
.cta-ideaton h3 { color:var(--ink-900); font-size:1.4rem; font-weight:700; margin-bottom:.5rem; }
.cta-ideaton p { color:var(--text-sub); font-size:.88rem; margin-bottom:1.5rem; line-height:1.7; }
.btn-cta {
  display:inline-block; background:var(--cyan-deep); color:#fff;
  font-family:'Inter',sans-serif; font-weight:700; font-size:.85rem;
  padding:.75rem 2.25rem; border-radius:var(--radius-pill);
  text-decoration:none; transition:all .2s;
  box-shadow:0 4px 16px rgba(0,118,184,.25);
}
.btn-cta:hover { background:var(--cyan); transform:translateY(-1px); box-shadow:0 6px 20px rgba(0,174,254,.3); text-decoration:none; }

/* ============================================================
   RESPONSIVE
   ============================================================ */
@media(max-width:900px) {
  .desafios-grid { grid-template-columns:repeat(2,1fr); }
  .tldr-grid { grid-template-columns:1fr; }
  .recursos-grid { grid-template-columns:1fr 1fr; }
}
@media(max-width:768px) {
  .hero-in { grid-template-columns:1fr; gap:2.5rem; }
  .hero-right { justify-content:center; }
  .hero-video-wrap { width:220px; }
  .hero h1 { font-size:2.1rem; }
  .resumen-grid, .hallazgos-grid, .vot-grid,
