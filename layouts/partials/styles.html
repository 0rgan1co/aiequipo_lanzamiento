<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  /* Paleta AI+Equipo */
  --cyan:#00ECFE;
  --cyan-b:#00AEFE;
  --cyan-light:#D4F8FE;
  --cyan-10:rgba(0,236,254,.10);
  --cyan-20:rgba(0,236,254,.20);
  --lavender:#CABDEC;
  --lavender-10:rgba(202,189,236,.12);
  --dark:#070708;
  --dark-mid:#565456;
  --white:#ffffff;
  --bg:#0E0F10;
  --bg-card:#1A1B1D;
  --bg-card-hover:#222326;
  --text:#E8E9EA;
  --muted:#8A8C90;
  --border:rgba(0,236,254,.15);
  --border-s:rgba(255,255,255,.08);
  --yellow:#FFCC00;
  --yellow-15:rgba(255,204,0,.15);
  --radius:14px;
  --radius-pill:9999px;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);line-height:1.7;font-size:15px;}
a{color:var(--cyan);}
</style><style>
/* HEADER */
.hdr{background:var(--dark);position:sticky;top:0;z-index:100;border-bottom:1px solid var(--border);}
.hdr-in{max-width:1140px;margin:0 auto;padding:.75rem 2rem;display:flex;align-items:center;justify-content:space-between;}
.logo{display:flex;align-items:center;gap:1rem;}
.logo-img{height:32px;width:auto;display:block;filter:brightness(0) invert(1);}
.logo-sub-wrap{border-left:1px solid rgba(255,255,255,.15);padding-left:1rem;}
.logo-sub{color:rgba(255,255,255,.4);font-size:.65rem;font-family:'Inter',sans-serif;letter-spacing:.3px;}
.nav{display:flex;gap:.1rem;}
.nav a{text-decoration:none;color:rgba(255,255,255,.5);font-family:'Inter',sans-serif;font-size:.7rem;font-weight:500;padding:.3rem .65rem;border-radius:var(--radius-pill);transition:.15s;text-transform:uppercase;letter-spacing:.5px;}
.nav a:hover{background:var(--cyan-10);color:var(--cyan);}

/* HERO */
.hero{background:linear-gradient(160deg,#0A0B0C 0%,#0D1820 60%,#071420 100%);padding:4.5rem 2rem 4rem;border-bottom:1px solid var(--border);}
.hero-in{max-width:1140px;margin:0 auto;display:grid;grid-template-columns:1fr auto;gap:3.5rem;align-items:start;}
.hero-left{display:flex;flex-direction:column;gap:1.5rem;}
.hero-right{display:flex;align-items:flex-start;justify-content:center;}
.hero-video-wrap{width:255px;border-radius:20px;overflow:hidden;box-shadow:0 0 0 1px var(--border),0 16px 48px rgba(0,0,0,.6);aspect-ratio:9/16;background:#000;position:relative;}
.hero-video-wrap video{width:100%;height:100%;object-fit:cover;display:block;}
.unmute-btn{position:absolute;bottom:12px;right:12px;background:rgba(0,0,0,.6);border:none;border-radius:50%;width:34px;height:34px;font-size:1rem;cursor:pointer;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(6px);transition:.15s;color:white;}
.unmute-btn:hover{background:rgba(0,236,254,.25);}
.hero-eyebrow{font-family:'Inter',sans-serif;font-size:.65rem;font-weight:600;color:var(--cyan);letter-spacing:3px;text-transform:uppercase;}
.hero h1{font-size:2.75rem;font-weight:700;line-height:1.08;letter-spacing:-1.5px;color:var(--white);}
.hero h1 span{color:var(--cyan);}
.hero-desc{color:rgba(255,255,255,.6);font-size:.92rem;line-height:1.8;max-width:520px;}
.hero-meta{display:flex;flex-wrap:wrap;gap:.4rem;}
.pill{display:inline-flex;align-items:center;padding:.2rem .65rem;border-radius:var(--radius-pill);font-size:.68rem;font-weight:600;font-family:'Inter',sans-serif;border:1px solid;letter-spacing:.2px;}
.pill-c{background:var(--cyan-10);color:var(--cyan);border-color:var(--cyan-20);}
.pill-y{background:var(--yellow-15);color:var(--yellow);border-color:rgba(255,204,0,.3);}
.pill-w{background:rgba(255,255,255,.06);color:rgba(255,255,255,.7);border-color:rgba(255,255,255,.12);}

/* STAT CARDS */
.stat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:.6rem;}
.stat-card{background:rgba(0,236,254,.06);border:1px solid var(--border);border-radius:var(--radius);padding:.875rem 1rem;text-align:center;}
.stat-n{font-size:1.9rem;font-weight:700;color:var(--cyan);line-height:1;margin-bottom:.2rem;letter-spacing:-1px;}
.stat-l{font-size:.68rem;color:rgba(255,255,255,.5);font-family:'Inter',sans-serif;line-height:1.4;}
</style><style>
/* MAIN LAYOUT */
.main{max-width:1140px;margin:0 auto;padding:3rem 2rem;}
.sec{margin-bottom:3.5rem;}
.sec-hdr{display:flex;align-items:baseline;gap:.875rem;margin-bottom:2rem;padding-bottom:.75rem;border-bottom:1px solid var(--border);}
.sec-num{font-family:'Inter',monospace;font-size:.65rem;color:var(--cyan);letter-spacing:1.5px;font-weight:700;}
.sec-title{font-size:1.4rem;font-weight:700;letter-spacing:-.5px;color:var(--white);}
.sep{border:none;border-top:1px solid var(--border-s);margin:3rem 0;}

/* RESUMEN / WHAT WAS IT */
.resumen-selfie{margin-bottom:1.75rem;border-radius:16px;overflow:hidden;position:relative;}
.selfie-img{width:100%;max-height:420px;object-fit:cover;object-position:center 30%;display:block;border-radius:16px;}
.selfie-caption{position:absolute;bottom:0;left:0;right:0;background:linear-gradient(to top,rgba(7,7,8,.85),transparent);color:rgba(255,255,255,.7);font-size:.75rem;font-family:'Inter',sans-serif;padding:1.5rem 1.25rem .875rem;border-radius:0 0 16px 16px;}
.resumen-grid{display:grid;grid-template-columns:1fr 1fr;gap:1rem;}
.res-card{background:var(--bg-card);border:1px solid var(--border-s);border-radius:var(--radius);padding:1.25rem;border-top:2px solid var(--cyan);transition:border-color .2s;}
.res-card:hover{border-top-color:var(--cyan-b);}
.res-card-icon{font-size:1.4rem;margin-bottom:.6rem;}
.res-card-title{font-weight:700;font-size:.88rem;margin-bottom:.4rem;color:var(--white);}
.res-card-desc{font-size:.78rem;color:var(--muted);line-height:1.7;}

/* DESAFIOS */
.desafios-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1rem;}
.desafio-card{background:var(--bg-card);border:1px solid var(--border-s);border-radius:var(--radius);padding:1.125rem;position:relative;transition:all .2s;}
.desafio-card:hover{background:var(--bg-card-hover);border-color:var(--border);}
.desafio-id{display:inline-block;font-family:'Inter',sans-serif;font-size:.62rem;font-weight:700;color:var(--dark);background:var(--cyan);padding:.12rem .4rem;border-radius:4px;letter-spacing:.5px;margin-bottom:.5rem;}
.desafio-title{font-weight:700;font-size:.88rem;line-height:1.4;margin-bottom:.5rem;color:var(--white);}
.desafio-desc{font-size:.75rem;color:var(--muted);line-height:1.65;}
.desafio-card.top{border-top:2px solid var(--yellow);}
.desafio-card.top .desafio-id{background:var(--yellow);color:var(--dark);}
.top-badge{display:inline-block;background:var(--yellow-15);color:var(--yellow);border:1px solid rgba(255,204,0,.25);font-size:.58rem;font-weight:700;padding:.1rem .4rem;border-radius:var(--radius-pill);font-family:'Inter',sans-serif;text-transform:uppercase;letter-spacing:.5px;margin-bottom:.4rem;}

/* COSECHA */
.cosecha-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:1rem;}
.cosecha-card .desafio-card{height:100%;}
.cosecha-ideas{display:flex;flex-direction:column;gap:.5rem;margin:.6rem 0;}
.idea{font-size:.75rem;color:var(--muted);line-height:1.55;padding:.4rem .6rem;background:rgba(255,255,255,.04);border-radius:8px;}
.idea strong{color:var(--text);}
.cosecha-quote{font-size:.73rem;color:var(--cyan-light);font-style:italic;border-left:2px solid var(--cyan);padding-left:.65rem;margin-top:.75rem;line-height:1.6;opacity:.85;}

/* HALLAZGOS */
.hallazgos-grid{display:grid;grid-template-columns:1fr 1fr;gap:1rem;}
.hallazgo-card{background:var(--bg-card);border:1px solid var(--border-s);border-radius:var(--radius);padding:1.125rem;}
.hallazgo-hdr{display:flex;align-items:center;gap:.625rem;margin-bottom:.75rem;}
.hallazgo-id{font-family:'Inter',sans-serif;font-size:.6rem;font-weight:700;padding:.18rem .4rem;border-radius:4px;color:var(--white);}
.hallazgo-id.pos{background:#1B7A3E;}
.hallazgo-id.neg{background:#8B1A1A;}
.hallazgo-id.neu{background:var(--dark-mid);}
.hallazgo-title{font-weight:700;font-size:.85rem;color:var(--white);line-height:1.35;}
.hallazgo-desc{font-size:.75rem;color:var(--muted);line-height:1.65;margin-bottom:.625rem;}
.hallazgo-quote{font-size:.73rem;color:var(--cyan-light);font-style:italic;border-left:2px solid var(--cyan);padding-left:.625rem;line-height:1.6;opacity:.85;}
.temp{display:inline-flex;align-items:center;gap:.25rem;font-size:.65rem;font-family:'Inter',sans-serif;font-weight:600;margin-left:auto;}
.temp.neg{color:#EF9A9A;}
.temp.pos{color:#A5D6A7;}
</style><style>
/* VOTACIONES */
.vot-grid{display:grid;grid-template-columns:1fr 1fr;gap:1.25rem;}
.vot-card{background:var(--bg-card);border:1px solid var(--border-s);border-radius:var(--radius);padding:1.25rem;}
.vot-title{font-weight:700;font-size:.88rem;color:var(--white);margin-bottom:1rem;padding-bottom:.5rem;border-bottom:1px solid var(--border);}
.vot-item{display:flex;align-items:center;gap:.75rem;margin-bottom:.625rem;}
.vot-rank{font-family:'Inter',sans-serif;font-size:.72rem;font-weight:700;color:var(--cyan);width:22px;flex-shrink:0;}
.vot-label{font-size:.76rem;color:var(--text);flex:1;line-height:1.4;}
.vot-bar-w{width:70px;height:4px;background:rgba(255,255,255,.08);border-radius:3px;overflow:hidden;flex-shrink:0;}
.vot-bar{height:100%;border-radius:3px;background:var(--cyan);}
.vot-bar.top{background:var(--yellow);}
.vot-result{display:flex;align-items:center;gap:.875rem;margin-bottom:.75rem;padding:.75rem;background:rgba(0,236,254,.06);border:1px solid var(--border);border-radius:10px;}
.vot-result.winner{background:rgba(0,236,254,.09);border-color:var(--cyan-20);}
.vot-result-n{font-size:1.6rem;font-weight:700;color:var(--cyan);flex-shrink:0;min-width:52px;letter-spacing:-1px;}
.vot-result-label{font-size:.76rem;color:var(--muted);line-height:1.45;}
.vot-result-label strong{color:var(--text);}

/* RECURSOS */
.recursos-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1rem;}
.rec-link{display:flex;align-items:center;gap:.875rem;background:var(--bg-card);border:1px solid var(--border-s);border-radius:var(--radius);padding:1rem 1.125rem;text-decoration:none;color:var(--text);transition:all .2s;}
.rec-link:hover{border-color:var(--cyan);background:var(--bg-card-hover);box-shadow:0 0 20px rgba(0,236,254,.08);}
.rec-icon{width:40px;height:40px;border-radius:10px;background:var(--cyan-10);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:1.2rem;flex-shrink:0;}
.rec-title{font-weight:700;font-size:.83rem;color:var(--white);}
.rec-desc{font-size:.7rem;color:var(--muted);}
.rec-link svg{margin-left:auto;opacity:.3;flex-shrink:0;}

/* CIERRE */
.cierre{background:linear-gradient(135deg,#0A0B0C 0%,#0D1820 100%);border:1px solid var(--border);border-radius:20px;padding:2.5rem;text-align:center;}

/* FOOTER */
.footer{background:var(--dark);border-top:1px solid var(--border-s);padding:1.5rem 2rem;text-align:center;font-size:.7rem;color:rgba(255,255,255,.3);font-family:'Inter',sans-serif;margin-top:3rem;letter-spacing:.2px;}
.footer strong{color:rgba(255,255,255,.6);}

/* TLDR */
.tldr{background:linear-gradient(135deg,rgba(0,236,254,.08),rgba(202,189,236,.06));border:1px solid var(--border);border-radius:16px;padding:1.25rem 1.5rem;margin-bottom:2.5rem;display:flex;align-items:flex-start;gap:1rem;}
.tldr-icon{font-size:1.4rem;flex-shrink:0;margin-top:.1rem;}
.tldr-content{flex:1;}
.tldr-label{font-family:'Inter',sans-serif;font-size:.62rem;font-weight:700;color:var(--cyan);letter-spacing:2px;text-transform:uppercase;margin-bottom:.3rem;}
.tldr-text{font-size:.85rem;color:var(--muted);line-height:1.7;}

/* SELFIE RESUMEN */
.resumen-selfie{margin-bottom:1.75rem;border-radius:16px;overflow:hidden;position:relative;}
.selfie-img{width:100%;max-height:400px;object-fit:cover;object-position:center 30%;display:block;}
.selfie-caption{position:absolute;bottom:0;left:0;right:0;background:linear-gradient(to top,rgba(7,7,8,.88),transparent);color:rgba(255,255,255,.6);font-size:.72rem;font-family:'Inter',sans-serif;padding:2rem 1.25rem .875rem;}

/* RESPONSIVE */
@media(max-width:768px){
  .hero-in,.resumen-grid,.desafios-grid,.hallazgos-grid,.vot-grid,.recursos-grid,.stat-grid,.cosecha-grid{grid-template-columns:1fr;}
  .hero h1{font-size:2rem;}
  .nav{display:none;}
  .hero-in{gap:2rem;}
  .hero-right{justify-content:center;}
  .hero-video-wrap{width:210px;}
  .desafios-grid{grid-template-columns:1fr 1fr;}
}
@media(max-width:480px){
  .desafios-grid{grid-template-columns:1fr;}
  .main{padding:2rem 1.25rem;}
}
</style>
