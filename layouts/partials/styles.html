<link href="https://fonts.googleapis.com/css2?family=Red+Hat+Display:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --cyan:#00C8FF; --cyan-10:rgba(0,200,255,.10); --cyan-20:rgba(0,200,255,.20); --cyan-30:rgba(0,200,255,.30);
  --dark:#005A7F; --dark-80:rgba(0,90,127,.08);
  --yellow:#FFCC00; --yellow-15:rgba(255,204,0,.15);
  --black:#000; --white:#fff;
  --text:#0D1F2D; --muted:#4A6572;
  --border:rgba(0,200,255,.18); --border-s:#D6EEF7;
  --bg:#F5FBFE;
  --radius:12px; --radius-pill:9999px;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Red Hat Display',sans-serif;background:var(--bg);color:var(--text);line-height:1.7;font-size:15px;}

/* HEADER */
.hdr{background:var(--dark);position:sticky;top:0;z-index:100;border-bottom:1px solid rgba(0,200,255,.15);}
.hdr-in{max-width:1100px;margin:0 auto;padding:.75rem 2rem;display:flex;align-items:center;justify-content:space-between;}
.logo{display:flex;align-items:center;gap:.75rem;}
.logo-badge{background:var(--cyan);color:var(--black);font-family:'Inter',sans-serif;font-weight:700;font-size:.7rem;padding:.25rem .6rem;border-radius:var(--radius-pill);letter-spacing:.5px;text-transform:uppercase;}
.logo-name{color:var(--white);font-weight:700;font-size:1rem;letter-spacing:-.3px;}
.logo-sub{color:rgba(255,255,255,.55);font-size:.72rem;font-family:'Inter',sans-serif;}
.nav{display:flex;gap:.1rem;}
.nav a{text-decoration:none;color:rgba(255,255,255,.65);font-family:'Inter',sans-serif;font-size:.72rem;font-weight:500;padding:.3rem .6rem;border-radius:var(--radius-pill);transition:.15s;text-transform:uppercase;letter-spacing:.4px;}
.nav a:hover{background:var(--cyan-10);color:var(--cyan);}

/* HERO */
.hero{background:linear-gradient(135deg,var(--dark) 0%,#003D5C 100%);padding:4rem 2rem 3.5rem;}
.hero-in{max-width:1100px;margin:0 auto;display:grid;grid-template-columns:1fr auto;gap:3rem;align-items:start;}
.hero-left{display:flex;flex-direction:column;gap:1.25rem;}
.hero-right{display:flex;align-items:flex-start;justify-content:center;}
.hero-video-wrap{width:260px;border-radius:16px;overflow:hidden;box-shadow:0 8px 32px rgba(0,0,0,.35);aspect-ratio:9/16;background:#000;position:relative;}
.hero-video-wrap video{width:100%;height:100%;object-fit:cover;display:block;border-radius:16px;}
.unmute-btn{position:absolute;bottom:12px;right:12px;background:rgba(0,0,0,.55);border:none;border-radius:50%;width:36px;height:36px;font-size:1.1rem;cursor:pointer;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(4px);transition:.15s;}
.unmute-btn:hover{background:rgba(0,0,0,.8);}
.hero-eyebrow{font-family:'Inter',sans-serif;font-size:.68rem;font-weight:600;color:var(--cyan);letter-spacing:2.5px;text-transform:uppercase;}
.hero h1{font-size:2.8rem;font-weight:700;line-height:1.1;letter-spacing:-1.5px;color:var(--white);}
.hero h1 span{color:var(--cyan);}
.hero-desc{color:rgba(255,255,255,.72);font-size:.95rem;line-height:1.75;}
.hero-meta{display:flex;flex-wrap:wrap;gap:.5rem;}
.pill{display:inline-flex;align-items:center;gap:.3rem;padding:.25rem .7rem;border-radius:var(--radius-pill);font-size:.72rem;font-weight:600;font-family:'Inter',sans-serif;border:1px solid;}
.pill-c{background:var(--cyan-10);color:var(--cyan);border-color:var(--cyan-20);}
.pill-y{background:var(--yellow-15);color:#fff;border-color:rgba(255,204,0,.4);}
.pill-w{background:rgba(255,255,255,.08);color:rgba(255,255,255,.85);border-color:rgba(255,255,255,.2);}

/* STAT CARDS */
.stat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:.75rem;}
.stat-card{background:rgba(0,200,255,.08);border:1px solid var(--cyan-20);border-radius:var(--radius);padding:1rem 1.125rem;text-align:center;}
.stat-n{font-size:2rem;font-weight:700;color:var(--cyan);line-height:1;margin-bottom:.2rem;}
.stat-l{font-size:.72rem;color:rgba(255,255,255,.65);font-family:'Inter',sans-serif;line-height:1.4;}

/* MAIN */
.main{max-width:1100px;margin:0 auto;padding:2.5rem 2rem;}
.sec{margin-bottom:3rem;}
.sec-hdr{display:flex;align-items:baseline;gap:.875rem;margin-bottom:1.75rem;padding-bottom:.625rem;border-bottom:2px solid var(--cyan);}
.sec-num{font-family:'Inter',monospace;font-size:.68rem;color:var(--cyan);letter-spacing:1px;font-weight:600;}
.sec-title{font-size:1.45rem;font-weight:700;letter-spacing:-.5px;color:var(--text);}
.sep{border:none;border-top:1px solid var(--border-s);margin:2.5rem 0;}

/* RESUMEN */
.resumen-grid{display:grid;grid-template-columns:1fr 1fr;gap:1.25rem;}
.res-card{background:var(--white);border:1px solid var(--border-s);border-radius:var(--radius);padding:1.25rem;border-top:3px solid var(--cyan);}
.res-card-icon{font-size:1.5rem;margin-bottom:.5rem;}
.res-card-title{font-weight:700;font-size:.9rem;margin-bottom:.4rem;color:var(--dark);}
.res-card-desc{font-size:.8rem;color:var(--muted);line-height:1.65;}

/* DESAFIOS */
.desafios-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1rem;}
.desafio-card{background:var(--white);border:1px solid var(--border-s);border-radius:var(--radius);padding:1.125rem;position:relative;transition:box-shadow .2s;}
.desafio-card:hover{box-shadow:0 4px 20px rgba(0,200,255,.12);}
.desafio-id{font-family:'Inter',sans-serif;font-size:.65rem;font-weight:700;color:var(--cyan);letter-spacing:1px;text-transform:uppercase;margin-bottom:.4rem;}
.desafio-title{font-weight:700;font-size:.88rem;line-height:1.4;margin-bottom:.5rem;color:var(--text);}
.desafio-desc{font-size:.75rem;color:var(--muted);line-height:1.6;}
.desafio-card.top{border-top:3px solid var(--yellow);}
.desafio-card.top .desafio-id{color:#806600;}
.top-badge{display:inline-block;background:var(--yellow-15);color:#806600;border:1px solid rgba(255,204,0,.4);font-size:.6rem;font-weight:700;padding:.1rem .4rem;border-radius:var(--radius-pill);font-family:'Inter',sans-serif;text-transform:uppercase;letter-spacing:.5px;margin-bottom:.4rem;}

/* HALLAZGOS */
.hallazgos-grid{display:grid;grid-template-columns:1fr 1fr;gap:1rem;}
.hallazgo-card{background:var(--white);border:1px solid var(--border-s);border-radius:var(--radius);padding:1.125rem;}
.hallazgo-hdr{display:flex;align-items:center;gap:.625rem;margin-bottom:.75rem;}
.hallazgo-id{background:var(--dark);color:var(--white);font-family:'Inter',sans-serif;font-size:.62rem;font-weight:700;padding:.2rem .45rem;border-radius:4px;}
.hallazgo-id.pos{background:#1B7A3E;}
.hallazgo-id.neg{background:#B71C1C;}
.hallazgo-title{font-weight:700;font-size:.85rem;color:var(--text);line-height:1.35;}
.hallazgo-desc{font-size:.75rem;color:var(--muted);line-height:1.6;margin-bottom:.625rem;}
.hallazgo-quote{font-size:.75rem;color:var(--dark);font-style:italic;border-left:2px solid var(--cyan);padding-left:.625rem;line-height:1.6;}
.temp{display:inline-flex;align-items:center;gap:.25rem;font-size:.68rem;font-family:'Inter',sans-serif;font-weight:600;margin-left:auto;}
.temp.neg{color:#B71C1C;}
.temp.pos{color:#1B7A3E;}

/* VOTACIONES */
.vot-grid{display:grid;grid-template-columns:1fr 1fr;gap:1.25rem;}
.vot-card{background:var(--white);border:1px solid var(--border-s);border-radius:var(--radius);padding:1.25rem;}
.vot-title{font-weight:700;font-size:.88rem;color:var(--dark);margin-bottom:1rem;padding-bottom:.5rem;border-bottom:2px solid var(--cyan);}
.vot-item{display:flex;align-items:center;gap:.75rem;margin-bottom:.625rem;}
.vot-rank{font-family:'Inter',sans-serif;font-size:.75rem;font-weight:700;color:var(--cyan);width:20px;flex-shrink:0;}
.vot-label{font-size:.78rem;color:var(--text);flex:1;line-height:1.4;}
.vot-bar-w{width:80px;height:5px;background:var(--border-s);border-radius:3px;overflow:hidden;flex-shrink:0;}
.vot-bar{height:100%;border-radius:3px;background:var(--cyan);}
.vot-bar.top{background:var(--yellow);}
.vot-result{display:flex;align-items:center;gap:.75rem;margin-bottom:.75rem;padding:.625rem;background:var(--dark-80);border-radius:8px;}
.vot-result-n{font-size:1.5rem;font-weight:700;color:var(--dark);flex-shrink:0;min-width:40px;}
.vot-result-label{font-size:.78rem;color:var(--text);line-height:1.4;}
.vot-result.winner{background:rgba(0,200,255,.08);border:1px solid var(--cyan-20);}
.vot-result.winner .vot-result-n{color:var(--dark);}

/* PROXIMOS */
.proximos-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1rem;}
.prox-card{background:var(--white);border:1px solid var(--border-s);border-radius:var(--radius);padding:1.125rem;}
.prox-step{font-family:'Inter',sans-serif;font-size:.65rem;font-weight:700;color:var(--cyan);letter-spacing:1px;text-transform:uppercase;margin-bottom:.4rem;}
.prox-title{font-weight:700;font-size:.9rem;margin-bottom:.4rem;color:var(--text);}
.prox-desc{font-size:.78rem;color:var(--muted);line-height:1.6;}
.prox-card.highlight{border-top:3px solid var(--cyan);background:rgba(0,200,255,.03);}

/* RECURSOS */
.recursos-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1rem;}
.rec-link{display:flex;align-items:center;gap:.75rem;background:var(--white);border:1px solid var(--border-s);border-radius:var(--radius);padding:1rem 1.125rem;text-decoration:none;color:var(--text);transition:all .2s;}
.rec-link:hover{border-color:var(--cyan);box-shadow:0 4px 16px rgba(0,200,255,.12);}
.rec-icon{width:40px;height:40px;border-radius:10px;background:var(--cyan-10);display:flex;align-items:center;justify-content:center;font-size:1.2rem;flex-shrink:0;}
.rec-title{font-weight:700;font-size:.85rem;color:var(--dark);}
.rec-desc{font-size:.72rem;color:var(--muted);}
.rec-link svg{margin-left:auto;opacity:.4;flex-shrink:0;}

/* CTA IDEATON */
.cta-ideaton{background:linear-gradient(135deg,var(--dark) 0%,#003D5C 100%);border-radius:16px;padding:2rem;text-align:center;margin-bottom:2rem;}
.cta-ideaton h3{color:var(--white);font-size:1.4rem;font-weight:700;margin-bottom:.5rem;}
.cta-ideaton p{color:rgba(255,255,255,.7);font-size:.88rem;margin-bottom:1.25rem;}
.btn-cta{display:inline-block;background:var(--yellow);color:var(--black);font-family:'Inter',sans-serif;font-weight:700;font-size:.85rem;padding:.75rem 2rem;border-radius:var(--radius-pill);text-decoration:none;transition:opacity .15s;}
.btn-cta:hover{opacity:.88;}

/* FOOTER */
.footer{background:var(--dark);border-top:1px solid rgba(0,200,255,.15);padding:1.5rem 2rem;text-align:center;font-size:.72rem;color:rgba(255,255,255,.5);font-family:'Inter',sans-serif;margin-top:2.5rem;}
.footer strong{color:rgba(255,255,255,.8);}

/* WORD CLOUD */
.word-cloud{display:flex;flex-wrap:wrap;gap:.5rem;padding:1.25rem;background:var(--white);border:1px solid var(--border-s);border-radius:var(--radius);justify-content:center;align-items:center;}
.word{padding:.2rem .5rem;border-radius:var(--radius-pill);font-weight:600;font-family:'Inter',sans-serif;}
.w-xl{font-size:1.4rem;color:var(--dark);}
.w-lg{font-size:1.1rem;color:#1B7A3E;}
.w-md{font-size:.9rem;color:#806600;}
.w-sm{font-size:.78rem;color:var(--muted);}


@media(max-width:768px){
  .hero-in{grid-template-columns:1fr;gap:2rem;}
  .hero-right{justify-content:center;}
  .hero-video-wrap{width:220px;}
  .hero-in,.resumen-grid,.desafios-grid,.hallazgos-grid,.vot-grid,.proximos-grid,.recursos-grid,.stat-grid{grid-template-columns:1fr;}
  .hero h1{font-size:2rem;}
  .nav{display:none;}
  .hero-video{padding:0 1rem 2rem;}
}
</style>
